<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ZHarness</title>
		<link rel="icon" type="image/svg+xml" href="/ui/logo/top.svg" />
		<link rel="alternate icon" type="image/png" href="/ui/logo/top.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var saved = localStorage.getItem("zharness-theme");
					if (saved === "dark") {
						document.documentElement.classList.add("dark");
					}
					var fontSize = localStorage.getItem("zharness-font-size");
					var px = { small: 14, standard: 16, large: 18 }[fontSize];
					if (px) {
						document.documentElement.style.fontSize = px + "px";
					}
				} catch (e) {}

				// 换肤插件开机防闪：回放上次应用的皮肤（色板 CSS / 图片图层），
				// 先于 React 挂载上妆，避免先白一帧再换肤。正常路径由 lib/skins.ts
				// 维护缓存；这里只读不写，失败静默走默认皮肤。
				try {
					var skinId = localStorage.getItem('zharness-skin-id');
					var skinCss = localStorage.getItem('zharness-skin-css');
					var skinImage = localStorage.getItem('zharness-skin-image');
					if (skinCss) {
						var st = document.createElement('style');
						st.id = 'zharness-skin-vars';
						st.textContent = skinCss;
						document.head.appendChild(st);
					} else if (skinImage && skinId) {
						var st2 = document.createElement('style');
						st2.id = 'zharness-skin-vars';
						st2.textContent = 'body::before { content: ""; position: fixed; inset: 0; z-index: -2; background-image: url(' + skinImage + '); background-size: cover; background-position: center; }';
						document.head.appendChild(st2);
					}
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
