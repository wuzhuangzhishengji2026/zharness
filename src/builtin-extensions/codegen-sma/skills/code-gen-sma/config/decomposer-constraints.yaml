# 任务分解约束配置
# 此配置可被 stage3 读取，也支持在项目 KnowledgeBase/config/ 下覆盖

# ============================================================
# 任务分解规则
# ============================================================

# 任务拆分粒度
# coarse: 粗粒度（一个模块一个任务）
# medium: 中等粒度（一个功能点一个任务，默认）
# fine:  细粒度（一个函数一个任务）
granularity: "medium"

# 每个子任务的最大复杂度（直接关联文件数）
max_files_per_task: 3

# 最大子任务数量（超过则建议合并）
max_subtasks: 8

# ============================================================
# 依赖分析规则
# ============================================================
dependency_rules:
  # 是否自动分析模块间依赖关系
  auto_analyze_dependencies: true

  # 依赖标注方式
  # "file_level": 标注到具体文件
  # "module_level": 标注到模块
  dependency_marking: "module_level"

  # 是否生成依赖图描述
  generate_dependency_diagram: true

# ============================================================
# 任务描述规范
# ============================================================
task_description:
  # 每个子任务必须包含的字段
  required_fields:
    - "id"                # 任务编号
    - "name"              # 任务名称
    - "objective"         # 任务目标
    - "files"             # 涉及文件
    - "dependencies"      # 前置依赖
    - "knowledge_refs"    # 参考知识来源
    - "example_refs"      # 参考示例代码
    - "acceptance"        # 验收标准

  # 验收标准必须包含
  acceptance_criteria:
    - "编译通过"
    - "接口调用正确"
    - "功能符合需求描述"

# ============================================================
# 特殊约束（可自由扩展）
# ============================================================
custom_constraints:
  # 示例：
  # namespace_rules: "使用 company::project::module 命名空间"
  # file_naming: "每个类一个文件，文件名与类名一致"
