# 编译环境配置
# 请根据实际项目情况修改以下配置
#
# ⚠️ 安全提示：本文件为入库模板，远程主机地址与凭据已用占位符脱敏。
#    真实值请配置在项目级覆盖文件 <项目根>/KnowledgeBase/config/build-env.yaml
#    （该目录不应提交到代码仓库），或通过环境变量注入。

# ============================================================
# 基础配置
# ============================================================

# 是否需要编译验证（true=需要编译验证, false=跳过编译）
require_build: true

# 编程语言及版本（不写死，根据项目配置）
language: "cpp"
language_version: "11"

# 编译重试次数（编译失败后最大重试次数）
max_retry: 3

# ============================================================
# 构建系统配置
# ============================================================
# 构建系统类型：cmake / qmake / makefile / meson / gradle / maven / cargo / go
build_system: "makefile"

# 文件同步脚本路径（设为 "auto"，或手动指定完整命令）
sync_script: "auto"

# SSH 工具路径（如果在系统 PATH 中，填命令名即可）
scp_path: "scp"
ssh_path: "ssh"
sshpass_path: "sshpass"

# ============================================================
# 远程编译配置
# ============================================================

# 是否使用远程编译环境
remote: true

# 远程编译机 IP 地址
remote_host: "<REMOTE_HOST>"

# 远程编译机端口
remote_port: 22

# 远程登录用户名
remote_user: "<REMOTE_USER>"

# 远程登录密码（与 ssh_key 二选一，优先使用密码）
remote_password: "<REMOTE_PASSWORD>"

# 远程项目代码根目录
remote_path: "/home/<REMOTE_USER>/src/<PROJECT>/"

# ============================================================
# 测试部署配置
# ============================================================

# 是否需要部署测试（true=编译成功后部署到测试机并运行测试）
require_test: true

# 测试机 IP 地址
test_host: "<REMOTE_HOST>"

# 测试机端口
test_port: 22

# 测试机登录用户名
test_user: "<REMOTE_USER>"

# 测试机登录密码
test_password: "<REMOTE_PASSWORD>"

# 测试机部署目标路径（编译产物拷贝到此目录）
test_path: "/home/<REMOTE_USER>/bin"

# 测试超时时间（秒）
test_timeout: 60

# 测试通过的条件：exit code = 0 表示通过
# 如果测试命令输出中包含期望的关键词，可在此配置
test_pass_keywords: ["PASS", "SUCCESS", "测试通过"]

# ============================================================
# 目标平台配置（交叉编译时使用，可选）
# ============================================================

# 目标操作系统: linux / windows / darwin（空表示当前平台）
target_os: "linux"

# 目标架构: amd64 / arm64 / x86（空表示当前架构）
target_arch: "amd64"