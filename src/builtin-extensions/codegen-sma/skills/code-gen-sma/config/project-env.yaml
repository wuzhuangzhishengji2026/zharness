# 项目特有环境配置
# 存放本项目的特有配置信息，如环境变量、路径约定等
# 请根据实际项目情况修改

# ============================================================
# 环境变量（编译和运行时需要设置的环境变量）
# ============================================================
env:
  # 示例：第三方库路径
  # THIRD_PARTY_HOME: "/opt/third-party"
  # BOOST_ROOT: "/usr/local/boost"
  # QT_HOME: "/opt/Qt/6.5.0/gcc_64"

# ============================================================
# 编译产物路径
# ============================================================
paths:
  # 可执行文件输出路径（相对于项目根目录或绝对路径）
  bin_dir: "build/bin"

  # 动态库/静态库输出路径
  lib_dir: "build/lib"

  # 头文件根路径（项目公共头文件所在目录）
  include_dir: "include"

  # 源代码根路径
  src_dir: "src"

  # 配置文件路径
  config_dir: "config"

# ============================================================
# 代码规范配置
# ============================================================
code_style:
  # 缩进方式: space / tab
  indent: "space"
  # 缩进宽度
  indent_width: 4
  # 行尾: lf / crlf
  line_ending: "lf"
  # 编码: utf-8 / gbk
  encoding: "utf-8"

# ============================================================
# 项目特有约定（根据需要扩展，任意键值对）
# ============================================================
conventions:
  # 示例：
  # namespace: "company::project"
  # naming_class: "PascalCase"
  # naming_function: "camelCase"
  # naming_constant: "UPPER_SNAKE_CASE"
